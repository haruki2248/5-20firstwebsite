<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本全土 | インタラクティブ地図</title>
  <style>
    :root {
      --ink: #241d18;
      --muted: #74695e;
      --paper: #efe3c9;
      --surface: rgba(255, 251, 239, 0.88);
      --line: #cdbb98;
      --blue: #24506a;
      --blue-dark: #142f3f;
      --red: #9d352c;
      --gold: #b98c3e;
      --green: #7fb069;
      --green-dark: #3f7444;
      --shadow: 0 22px 54px rgba(36, 29, 24, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", Arial, sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background:
        repeating-linear-gradient(96deg, rgba(74, 54, 32, 0.035) 0 1px, transparent 1px 18px),
        repeating-linear-gradient(4deg, rgba(255, 255, 255, 0.18) 0 2px, transparent 2px 24px),
        linear-gradient(180deg, rgba(36, 80, 106, 0.2), rgba(157, 53, 44, 0.06) 46%, rgba(239, 227, 201, 0) 78%),
        var(--paper);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      content: "";
      background:
        radial-gradient(circle at 0 100%, transparent 0 18px, rgba(36, 80, 106, 0.09) 19px 20px, transparent 21px),
        radial-gradient(circle at 24px 100%, transparent 0 18px, rgba(36, 80, 106, 0.06) 19px 20px, transparent 21px),
        linear-gradient(135deg, rgba(185, 140, 62, 0.16), transparent 34%),
        linear-gradient(315deg, rgba(36, 80, 106, 0.12), transparent 38%);
      background-size: 48px 28px, 48px 28px, 100% 100%, 100% 100%;
      opacity: 0.65;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 0 40px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid var(--red);
      border-radius: 8px;
      background: #f9efe1;
      color: var(--red);
      box-shadow: 4px 4px 0 rgba(36, 29, 24, 0.86);
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.94rem;
    }

    .nav-links a {
      color: var(--blue-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(360px, 1.12fr);
      gap: 40px;
      align-items: center;
      min-height: calc(100vh - 220px);
      padding-bottom: 36px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.8rem, 8vw, 6.4rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      line-height: 1.25;
    }

    p {
      margin: 0;
      font-size: 1.1rem;
    }

    .lead {
      max-width: 36rem;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.22rem);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: rgba(255, 248, 232, 0.92);
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .button.primary,
    button[aria-pressed="true"] {
      background: var(--red);
      color: #ffffff;
    }

    .button:hover,
    button:hover,
    .button:focus-visible,
    button:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
      outline: none;
    }

    .profile {
      display: grid;
      gap: 10px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.52), rgba(239, 227, 201, 0.58)),
        var(--surface);
      box-shadow: 0 12px 34px rgba(36, 29, 24, 0.08);
    }

    .profile p {
      color: var(--muted);
    }

    .google-map-section {
      margin-top: 28px;
      padding: 24px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.48), rgba(239, 227, 201, 0.58)),
        var(--surface);
      box-shadow: var(--shadow);
    }

    .google-map-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .google-map-header p {
      max-width: 34rem;
      color: var(--muted);
    }

    .google-map-frame {
      width: 100%;
      height: min(68vh, 520px);
      min-height: 360px;
      border: 1px solid rgba(36, 29, 24, 0.28);
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(255, 251, 239, 0.56);
    }

    @media (max-width: 860px) {
      main {
        padding: 28px 16px 40px;
      }

      .site-header {
        align-items: flex-start;
        padding-bottom: 28px;
      }

      .nav-links {
        gap: 12px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 24px;
        min-height: auto;
      }

      .google-map-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 560px) {
      .site-header,
      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
      }

      .button,
      button {
        width: 100%;
      }

      .google-map-section {
        padding: 16px;
      }

      .google-map-frame {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">日</span>
        <span>日本全土</span>
      </div>
      <nav class="nav-links" aria-label="ページ内メニュー">
        <a href="#about">About</a>
        <a href="#map">Map</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">日本を<br>見つける</h1>
        <p class="lead">Google Mapsで日本全体を表示し、拡大・縮小や移動をしながら各地を確認できるシンプルなWebサイトです。</p>
        <div class="hero-actions">
          <a class="button primary" href="#map">地図を見る</a>
          <a class="button" href="#about">サイトについて</a>
        </div>
      </div>

      <section id="about" class="profile" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
        <p>GitHub Pagesで公開できる、HTMLだけの軽いページです。Google Mapsの埋め込み地図を中心に、スマートフォンでも見やすいように整えています。</p>
      </section>
    </section>

    <section id="map" class="google-map-section" aria-labelledby="google-map-title">
      <div class="google-map-header">
        <div>
          <h2 id="google-map-title">Google Map</h2>
          <p>日本全体をGoogle Mapsで表示します。拡大・縮小や移動をしながら、現在の地図情報を確認できます。</p>
        </div>
      </div>
      <iframe
        class="google-map-frame"
        title="Google Mapで見る日本"
        src="https://www.google.com/maps?q=Japan&output=embed"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen>
      </iframe>
    </section>
  </main>
</body>
</html>
