<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本全土 | インタラクティブ地図</title>
  <style>
    :root {
      --ink: #182026;
      --muted: #65717c;
      --paper: #fffdf7;
      --surface: #ffffff;
      --line: #d8ddd7;
      --blue: #1d5f8f;
      --blue-dark: #123f63;
      --red: #b7352d;
      --green: #7fb069;
      --green-dark: #3f7444;
      --shadow: 0 18px 44px rgba(24, 32, 38, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", Arial, sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(29, 95, 143, 0.08), rgba(255, 253, 247, 0) 360px),
        var(--paper);
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 0 40px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--green);
      color: #ffffff;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.94rem;
    }

    .nav-links a {
      color: var(--blue-dark);
      font-weight: 700;
      text-decoration: none;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(360px, 1.12fr);
      gap: 40px;
      align-items: center;
      min-height: calc(100vh - 220px);
      padding-bottom: 36px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.8rem, 8vw, 6.4rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      line-height: 1.25;
    }

    p {
      margin: 0;
      font-size: 1.1rem;
    }

    .lead {
      max-width: 36rem;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.22rem);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .button.primary,
    button[aria-pressed="true"] {
      background: var(--red);
      color: #ffffff;
    }

    .button:hover,
    button:hover,
    .button:focus-visible,
    button:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
      outline: none;
    }

    .profile {
      display: grid;
      gap: 10px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
    }

    .profile p {
      color: var(--muted);
    }

    .map-section {
      display: grid;
      grid-template-columns: minmax(280px, 0.76fr) minmax(320px, 1fr);
      gap: 28px;
      align-items: center;
      padding: 24px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .map-copy {
      display: grid;
      gap: 18px;
      align-self: stretch;
    }

    .map-note {
      color: var(--muted);
    }

    .map-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .map-stage {
      display: grid;
      place-items: center;
      min-height: 520px;
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(216, 221, 215, 0.55) 1px, transparent 1px),
        linear-gradient(180deg, rgba(216, 221, 215, 0.55) 1px, transparent 1px),
        #f4f7f1;
      background-size: 28px 28px;
      border: 1px solid var(--line);
    }

    .map-container {
      max-width: 100%;
      width: min(360px, 72vw);
      filter: drop-shadow(0 18px 18px rgba(24, 32, 38, 0.14));
    }

    svg {
      width: 100%;
      height: auto;
      cursor: pointer;
    }

    .region,
    .prefecture {
      fill: var(--green);
      stroke: var(--blue-dark);
      stroke-width: 2;
      transition: fill 0.2s ease, transform 0.2s ease, filter 0.2s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    .region:hover,
    .region:focus,
    .prefecture:hover,
    .prefecture:focus {
      fill: #f2b84b;
      filter: brightness(1.02);
      transform: scale(1.025);
      outline: none;
    }

    .hidden {
      display: none;
    }

    .map-info {
      margin-top: auto;
      padding: 14px 16px;
      background: #f7efe0;
      border: 1px solid #e3c98f;
      border-left: 6px solid var(--red);
      border-radius: 8px;
      font-weight: bold;
      color: var(--blue-dark);
    }

    @media (max-width: 860px) {
      main {
        padding: 28px 16px 40px;
      }

      .site-header {
        align-items: flex-start;
        padding-bottom: 28px;
      }

      .nav-links {
        gap: 12px;
      }

      .hero,
      .map-section {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 24px;
        min-height: auto;
      }

      .map-stage {
        min-height: 460px;
      }
    }

    @media (max-width: 560px) {
      .site-header,
      .hero-actions,
      .map-controls {
        align-items: stretch;
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
      }

      .button,
      button {
        width: 100%;
      }

      .map-section {
        padding: 16px;
      }

      .map-stage {
        min-height: 400px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">日</span>
        <span>日本全土</span>
      </div>
      <nav class="nav-links" aria-label="ページ内メニュー">
        <a href="#about">About</a>
        <a href="#map">Map</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">日本を<br>見つける</h1>
        <p class="lead">地域と都道府県を切り替えながら、日本地図をクリックして地名を確認できるシンプルなWebサイトです。</p>
        <div class="hero-actions">
          <a class="button primary" href="#map">地図を見る</a>
          <a class="button" href="#about">サイトについて</a>
        </div>
      </div>

      <section id="about" class="profile" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
        <p>GitHub Pagesで公開できる、HTMLだけの軽いページです。スマートフォンでも見やすいように余白・色・地図エリアを整えています。</p>
      </section>
    </section>

    <section id="map" class="map-section" aria-labelledby="map-title">
      <div class="map-copy">
        <div>
          <h2 id="map-title">日本地図</h2>
          <p class="map-note">地域マップと都道府県マップを切り替えて、地図上のエリアを選択できます。</p>
        </div>
        <div class="map-controls" aria-label="地図の表示切り替え">
          <button id="toggle-map" type="button" aria-pressed="false">都道府県マップ</button>
        </div>
        <div id="map-info" class="map-info">地域マップを表示しています。地名をクリックしてください。</div>
      </div>

      <div class="map-stage">
        <div class="map-container" role="img" aria-label="日本地図">
          <svg id="region-map" class="map-svg" viewBox="0 0 300 760" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path class="region" data-name="北海道" d="M142 31 C162 15 200 18 216 43 C229 62 219 88 195 101 C171 114 132 103 119 77 C109 57 121 39 142 31 Z M218 84 C234 82 247 90 249 101 C236 105 223 100 218 84 Z" tabindex="0" />
            <path class="region" data-name="東北" d="M160 124 C181 130 196 154 194 185 C191 215 205 245 191 270 C179 292 155 288 143 265 C132 244 137 216 127 193 C118 171 126 142 143 130 C148 126 153 124 160 124 Z" tabindex="0" />
            <path class="region" data-name="関東" d="M139 267 C158 262 184 272 195 292 C205 311 199 334 180 346 C162 357 137 347 129 326 C121 306 126 276 139 267 Z" tabindex="0" />
            <path class="region" data-name="中部" d="M89 277 C113 257 148 255 164 274 C178 292 169 318 183 338 C195 356 180 379 151 380 C127 380 111 363 91 357 C70 351 64 329 73 309 C77 297 82 286 89 277 Z" tabindex="0" />
            <path class="region" data-name="関西" d="M78 365 C101 356 136 365 151 386 C165 405 153 429 128 438 C102 448 75 436 66 415 C58 395 62 372 78 365 Z" tabindex="0" />
            <path class="region" data-name="中国" d="M39 421 C66 407 105 410 130 429 C149 443 143 465 116 476 C88 487 52 480 35 460 C23 446 25 429 39 421 Z" tabindex="0" />
            <path class="region" data-name="四国" d="M121 489 C146 475 188 477 206 493 C220 506 211 528 185 536 C157 546 119 537 105 518 C96 506 105 497 121 489 Z" tabindex="0" />
            <path class="region" data-name="九州" d="M55 529 C83 516 116 529 127 555 C139 582 119 604 124 629 C128 648 107 670 80 666 C56 662 48 636 56 615 C63 597 45 579 42 559 C40 546 44 535 55 529 Z" tabindex="0" />
            <path class="region" data-name="沖縄" d="M146 690 C158 684 172 687 178 695 C167 702 152 701 146 690 Z M191 706 C204 703 217 708 221 717 C208 723 195 719 191 706 Z M114 674 C124 669 136 671 141 679 C130 685 119 683 114 674 Z" tabindex="0" />
          </svg>

          <svg id="prefecture-map" class="map-svg hidden" viewBox="0 0 300 760" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path class="prefecture" data-name="北海道" d="M142 31 C162 15 200 18 216 43 C229 62 219 88 195 101 C171 114 132 103 119 77 C109 57 121 39 142 31 Z M218 84 C234 82 247 90 249 101 C236 105 223 100 218 84 Z" tabindex="0" />
            <path class="prefecture" data-name="青森" d="M145 124 C165 116 188 127 194 147 C184 161 162 165 142 156 C128 149 129 132 145 124 Z" tabindex="0" />
            <path class="prefecture" data-name="宮城" d="M155 204 C176 204 193 221 194 241 C191 258 177 273 159 271 C143 262 139 236 145 219 C147 212 150 207 155 204 Z" tabindex="0" />
            <path class="prefecture" data-name="東京" d="M151 322 C164 316 181 320 188 332 C181 344 163 350 148 343 C139 338 141 328 151 322 Z" tabindex="0" />
            <path class="prefecture" data-name="愛知" d="M105 345 C127 337 154 343 166 360 C158 377 132 384 108 374 C94 366 93 352 105 345 Z" tabindex="0" />
            <path class="prefecture" data-name="大阪" d="M84 390 C103 383 126 391 137 406 C131 421 108 431 88 423 C75 416 73 397 84 390 Z" tabindex="0" />
            <path class="prefecture" data-name="広島" d="M49 425 C76 414 111 419 130 437 C118 453 82 463 53 454 C34 448 31 433 49 425 Z" tabindex="0" />
            <path class="prefecture" data-name="香川" d="M151 487 C172 481 198 486 207 499 C197 512 169 517 148 507 C137 501 139 491 151 487 Z" tabindex="0" />
            <path class="prefecture" data-name="福岡" d="M58 529 C82 518 112 527 123 548 C113 565 82 572 58 559 C44 550 45 536 58 529 Z" tabindex="0" />
            <path class="prefecture" data-name="鹿児島" d="M74 611 C96 601 121 614 125 636 C119 655 96 670 76 662 C58 654 58 624 74 611 Z" tabindex="0" />
            <path class="prefecture" data-name="沖縄" d="M146 690 C158 684 172 687 178 695 C167 702 152 701 146 690 Z M191 706 C204 703 217 708 221 717 C208 723 195 719 191 706 Z M114 674 C124 669 136 671 141 679 C130 685 119 683 114 674 Z" tabindex="0" />
          </svg>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const info = document.getElementById('map-info');
      const toggleButton = document.getElementById('toggle-map');
      const regionMap = document.getElementById('region-map');
      const prefectureMap = document.getElementById('prefecture-map');
      let currentLevel = 'region';

      function setMapLevel(level) {
        currentLevel = level;
        const isRegion = level === 'region';
        regionMap.classList.toggle('hidden', !isRegion);
        prefectureMap.classList.toggle('hidden', isRegion);
        toggleButton.textContent = isRegion ? '都道府県マップ' : '地域マップ';
        toggleButton.setAttribute('aria-pressed', String(!isRegion));
        info.textContent = (isRegion ? '地域マップ' : '都道府県マップ') + 'を表示しています。地図をクリックしてください。';
      }

      function addMapListeners(selector) {
        const elements = document.querySelectorAll(selector);
        elements.forEach(function (element) {
          element.addEventListener('click', function () {
            info.textContent = element.dataset.name + ' が選択されました。';
          });
          element.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              element.click();
            }
          });
        });
      }

      toggleButton.addEventListener('click', function () {
        setMapLevel(currentLevel === 'region' ? 'prefecture' : 'region');
      });

      addMapListeners('.region');
      addMapListeners('.prefecture');
    });
  </script>
</body>
</html>
