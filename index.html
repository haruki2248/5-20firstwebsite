<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小判ランナー | 2Dアクションゲーム</title>
  <style>
    :root {
      --ink: #1a1410;
      --muted: #6f6252;
      --paper: #d8c49b;
      --surface: rgba(245, 230, 197, 0.9);
      --line: #8e7042;
      --blue: #1f4052;
      --blue-dark: #0f2530;
      --red: #7b241f;
      --gold: #c39a45;
      --green: #7fb069;
      --green-dark: #3f7444;
      --shadow: 0 28px 68px rgba(20, 12, 6, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Noto Serif JP", "Yu Gothic", serif;
      line-height: 1.6;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -10%, rgba(195, 154, 69, 0.34), transparent 34rem),
        radial-gradient(circle at 0 8%, rgba(123, 36, 31, 0.26), transparent 24rem),
        radial-gradient(circle at 100% 16%, rgba(15, 37, 48, 0.32), transparent 28rem),
        linear-gradient(90deg, rgba(26, 20, 16, 0.5) 0 10px, transparent 10px calc(100% - 10px), rgba(26, 20, 16, 0.5) calc(100% - 10px)),
        repeating-linear-gradient(45deg, rgba(26, 20, 16, 0.08) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(135deg, rgba(255, 247, 224, 0.13) 0 1px, transparent 1px 22px),
        linear-gradient(180deg, #14100e 0, #542821 34%, #8a6d3f 66%, #d8c49b 100%),
        var(--paper);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      content: "";
      background:
        linear-gradient(30deg, transparent 36%, rgba(195, 154, 69, 0.18) 37% 39%, transparent 40%),
        linear-gradient(150deg, transparent 36%, rgba(195, 154, 69, 0.14) 37% 39%, transparent 40%),
        radial-gradient(circle at 72% 18%, rgba(255, 236, 178, 0.28) 0 4rem, transparent 4.2rem),
        linear-gradient(90deg, rgba(26, 20, 16, 0.1) 1px, transparent 1px),
        linear-gradient(180deg, rgba(26, 20, 16, 0.1) 1px, transparent 1px),
        radial-gradient(ellipse at center, transparent 40%, rgba(18, 12, 8, 0.46) 100%);
      background-size: 42px 72px, 42px 72px, 100% 100%, 84px 84px, 84px 84px, 100% 100%;
      opacity: 0.74;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 0 40px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: #f4dfaa;
      letter-spacing: 0;
      text-shadow: 0 2px 12px rgba(20, 12, 6, 0.42);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid var(--red);
      border-radius: 8px;
      background: linear-gradient(145deg, #ead39a, #8d2b24);
      color: #fff4d2;
      box-shadow: 4px 4px 0 rgba(20, 12, 6, 0.9);
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.94rem;
    }

    .nav-links a {
      color: #f1dca6;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 2px 10px rgba(20, 12, 6, 0.4);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(360px, 1.12fr);
      gap: 40px;
      align-items: center;
      min-height: calc(100vh - 220px);
      padding-bottom: 36px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.8rem, 8vw, 6.4rem);
      line-height: 0.95;
      letter-spacing: 0;
      color: #fff0bf;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      text-shadow:
        0 2px 0 rgba(26, 20, 16, 0.86),
        0 18px 32px rgba(20, 12, 6, 0.42);
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      line-height: 1.25;
      color: var(--ink);
    }

    p {
      margin: 0;
      font-size: 1.1rem;
    }

    .lead {
      max-width: 36rem;
      color: #f6e8c7;
      font-size: clamp(1rem, 1.8vw, 1.22rem);
      text-shadow: 0 2px 16px rgba(20, 12, 6, 0.5);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 240, 196, 0.96), rgba(213, 174, 94, 0.92));
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .button.primary,
    button[aria-pressed="true"] {
      background: linear-gradient(145deg, #9b332c, #5e1a16);
      color: #ffffff;
    }

    .button:hover,
    button:hover,
    .button:focus-visible,
    button:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
      outline: none;
    }

    .profile {
      display: grid;
      gap: 10px;
      padding: 22px;
      border: 1px solid rgba(195, 154, 69, 0.65);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 244, 215, 0.88), rgba(218, 189, 129, 0.68)),
        var(--surface);
      box-shadow:
        inset 0 0 0 1px rgba(255, 247, 224, 0.58),
        0 20px 46px rgba(20, 12, 6, 0.2);
    }

    .profile p {
      color: var(--muted);
    }

    .game-stat span {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .game-stats,
    .arcade-hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .game-stat {
      padding: 10px;
      border: 1px solid rgba(26, 20, 16, 0.26);
      border-radius: 8px;
      background: rgba(255, 248, 232, 0.7);
    }

    .game-stat strong {
      display: block;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .action-game-section {
      margin-top: 28px;
      padding: 24px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 244, 215, 0.92), rgba(123, 36, 31, 0.18)),
        var(--surface);
      box-shadow:
        inset 0 0 0 1px rgba(255, 247, 224, 0.48),
        var(--shadow);
    }

    .action-game-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .action-game-header p {
      color: var(--muted);
      max-width: 36rem;
    }

    .arcade-wrap {
      display: grid;
      gap: 16px;
    }

    .arcade-canvas {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid rgba(26, 20, 16, 0.78);
      border-radius: 8px;
      background: #1b2028;
      box-shadow:
        inset 0 0 0 1px rgba(255, 247, 224, 0.26),
        0 14px 32px rgba(20, 12, 6, 0.22);
    }

    .arcade-hud {
      grid-template-columns: repeat(4, 1fr);
    }

    .arcade-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    @media (max-width: 860px) {
      main {
        padding: 28px 16px 40px;
      }

      .site-header {
        align-items: flex-start;
        padding-bottom: 28px;
      }

      .nav-links {
        gap: 12px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 24px;
        min-height: auto;
      }

      .action-game-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 560px) {
      .site-header,
      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
      }

      .button,
      button {
        width: 100%;
      }

      .action-game-section {
        padding: 16px;
      }

      .arcade-hud {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">日</span>
        <span>小判ランナー</span>
      </div>
      <nav class="nav-links" aria-label="ページ内メニュー">
        <a href="#about">About</a>
        <a href="#action-game">Game</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">小判を<br>集める</h1>
        <p class="lead">古風な世界を走り抜け、小判を集めながら障害物を避ける2次元アクションゲームです。</p>
        <div class="hero-actions">
          <a class="button primary" href="#action-game">ゲームを始める</a>
          <a class="button" href="#about">サイトについて</a>
        </div>
      </div>

      <section id="about" class="profile" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
        <p>GitHub Pagesで公開できる、HTMLだけの2次元アクションゲームです。キーボードで移動とジャンプを操作できます。</p>
      </section>
    </section>

    <section id="action-game" class="action-game-section" aria-labelledby="action-game-title">
      <div class="action-game-header">
        <div>
          <h2 id="action-game-title">小判ランナー</h2>
          <p>剣と爆弾を使い、敵をかわしながら小判を集める2次元アクションゲームです。</p>
        </div>
      </div>
      <div class="arcade-wrap">
        <canvas id="runner-canvas" class="arcade-canvas" width="960" height="540" aria-label="小判ランナーゲーム画面"></canvas>
        <div class="arcade-hud">
          <div class="game-stat"><span>得点</span><strong id="runner-score">0</strong></div>
          <div class="game-stat"><span>小判</span><strong id="runner-coins">0</strong></div>
          <div class="game-stat"><span>体力</span><strong id="runner-life">3</strong></div>
          <div class="game-stat"><span>状態</span><strong id="runner-state">待機</strong></div>
          <div class="game-stat"><span>爆弾</span><strong id="runner-bombs">0</strong></div>
          <div class="game-stat"><span>仲間</span><strong id="runner-ally">なし</strong></div>
        </div>
        <div class="arcade-controls">
          <button id="runner-start" class="primary" type="button">アクションゲーム開始</button>
          <button id="runner-reset" type="button">リセット</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const runnerCanvas = document.getElementById('runner-canvas');
    const runnerCtx = runnerCanvas.getContext('2d');
    const runnerScore = document.getElementById('runner-score');
    const runnerCoins = document.getElementById('runner-coins');
    const runnerLife = document.getElementById('runner-life');
    const runnerState = document.getElementById('runner-state');
    const runnerBombs = document.getElementById('runner-bombs');
    const runnerAlly = document.getElementById('runner-ally');
    const runnerStart = document.getElementById('runner-start');
    const runnerReset = document.getElementById('runner-reset');
    const keys = new Set();
    const runner = {
      player: { x: 120, y: 392, w: 42, h: 54, vx: 0, vy: 0, facing: 1, grounded: true, invincible: 0, attack: 0 },
      platforms: [
        { x: 0, y: 456, w: 960, h: 84 },
        { x: 250, y: 358, w: 160, h: 22 },
        { x: 520, y: 300, w: 170, h: 22 },
        { x: 740, y: 382, w: 130, h: 22 }
      ],
      coins: [],
      enemies: [],
      arrows: [],
      pickups: [],
      bombs: [],
      score: 0,
      coinsTaken: 0,
      bombsHeld: 0,
      allyTime: 0,
      life: 3,
      running: false,
      lastTime: 0,
      spawnTimer: 0,
      pickupTimer: 0
    };

    function resetRunner() {
      runner.player = { x: 120, y: 392, w: 42, h: 54, vx: 0, vy: 0, facing: 1, grounded: true, invincible: 0, attack: 0 };
      runner.coins = [
        { x: 300, y: 314, r: 13, taken: false },
        { x: 580, y: 256, r: 13, taken: false },
        { x: 790, y: 338, r: 13, taken: false }
      ];
      runner.enemies = [
        { type: 'sword', x: 430, y: 402, w: 38, h: 54, vx: -70, hp: 2, cooldown: 0.8, attack: 0 },
        { type: 'archer', x: 790, y: 328, w: 38, h: 54, vx: 0, hp: 2, cooldown: 1.4, attack: 0 }
      ];
      runner.arrows = [];
      runner.pickups = [];
      runner.bombs = [];
      runner.score = 0;
      runner.coinsTaken = 0;
      runner.bombsHeld = 0;
      runner.allyTime = 0;
      runner.life = 3;
      runner.spawnTimer = 0;
      runner.pickupTimer = 0;
      runnerState.textContent = '待機';
      updateRunnerHud();
      drawRunner();
    }

    function updateRunnerHud() {
      runnerScore.textContent = Math.floor(runner.score);
      runnerCoins.textContent = runner.coinsTaken;
      runnerLife.textContent = runner.life;
      runnerBombs.textContent = runner.bombsHeld;
      runnerAlly.textContent = runner.allyTime > 0 ? '同行' : 'なし';
    }

    function drawSamurai(ctx, x, y, facing, colors, weapon) {
      const direction = facing || 1;
      ctx.save();
      ctx.translate(x + 21, y);
      ctx.scale(direction, 1);
      ctx.fillStyle = colors.armor;
      ctx.fillRect(-20, 26, 40, 28);
      ctx.fillStyle = colors.trim;
      ctx.fillRect(-23, 30, 46, 7);
      ctx.fillRect(-18, 45, 36, 5);
      ctx.fillStyle = '#f0d08b';
      ctx.fillRect(-12, 8, 24, 18);
      ctx.fillStyle = colors.helmet;
      ctx.fillRect(-18, 0, 36, 10);
      ctx.beginPath();
      ctx.moveTo(-14, 0);
      ctx.lineTo(0, -12);
      ctx.lineTo(14, 0);
      ctx.fill();
      ctx.strokeStyle = colors.trim;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-23, 2);
      ctx.lineTo(-38, -8);
      ctx.moveTo(23, 2);
      ctx.lineTo(38, -8);
      ctx.stroke();
      ctx.fillStyle = '#171312';
      ctx.fillRect(-8, 16, 5, 4);
      ctx.fillRect(4, 16, 5, 4);
      ctx.fillStyle = colors.armor;
      ctx.fillRect(-17, 54, 13, 12);
      ctx.fillRect(4, 54, 13, 12);
      if (weapon === 'bow') {
        ctx.strokeStyle = '#e6d2a6';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(25, 30, 23, -1.25, 1.25);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(25, 7);
        ctx.lineTo(25, 53);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#f5e6b5';
        ctx.fillRect(18, 28, 42, 6);
        ctx.fillStyle = '#6f4e1c';
        ctx.fillRect(10, 31, 16, 5);
      }
      ctx.restore();
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function groundYAt(x) {
      let y = 456;
      for (const platform of runner.platforms) {
        if (x >= platform.x && x <= platform.x + platform.w && platform.y < y) y = platform.y;
      }
      return y;
    }

    function hitPlayer() {
      const p = runner.player;
      if (p.invincible > 0) return;
      runner.life -= 1;
      p.invincible = 1.2;
      p.vy = -360;
      p.vx = -220 * p.facing;
    }

    function spawnPickup() {
      const type = Math.random() < 0.58 ? 'bomb' : 'ally';
      const x = 170 + Math.random() * 690;
      const ground = groundYAt(x);
      runner.pickups.push({ type, x, y: ground - 28, w: 28, h: 28 });
    }

    function damageEnemy(enemy, amount) {
      enemy.hp -= amount;
      enemy.attack = 0.12;
      if (enemy.hp <= 0) {
        enemy.dead = true;
        runner.score += enemy.type === 'archer' ? 180 : 140;
      }
    }

    function useBomb() {
      if (runner.bombsHeld <= 0 || !runner.running) return;
      const p = runner.player;
      runner.bombsHeld -= 1;
      runner.bombs.push({ x: p.x + p.w / 2, y: p.y + 18, r: 8, vx: p.facing * 340, vy: -280, fuse: 0.85 });
      updateRunnerHud();
    }

    function stepRunner(timestamp) {
      if (!runner.running) return;
      const dt = Math.min((timestamp - runner.lastTime) / 1000 || 0, 0.033);
      runner.lastTime = timestamp;
      const p = runner.player;
      const speed = 260;
      p.vx = 0;
      if (keys.has('left') || keys.has('a')) p.vx -= speed;
      if (keys.has('right') || keys.has('d')) p.vx += speed;
      if (p.vx !== 0) p.facing = p.vx > 0 ? 1 : -1;
      if ((keys.has('up') || keys.has(' ') || keys.has('w')) && p.grounded) {
        p.vy = -620;
        p.grounded = false;
      }
      if (keys.has('z') || keys.has('j')) {
        p.attack = Math.max(p.attack, 0.18);
      }
      p.vy += 1500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.x = Math.max(12, Math.min(906, p.x));
      p.grounded = false;
      for (const platform of runner.platforms) {
        const wasAbove = p.y + p.h - p.vy * dt <= platform.y;
        if (rectsOverlap(p, platform) && p.vy >= 0 && wasAbove) {
          p.y = platform.y - p.h;
          p.vy = 0;
          p.grounded = true;
        }
      }
      if (p.y > 560) {
        runner.life -= 1;
        p.x = 120;
        p.y = 392;
        p.vy = 0;
        p.invincible = 1.2;
      }
      if (p.invincible > 0) p.invincible -= dt;
      if (p.attack > 0) p.attack -= dt;
      for (const coin of runner.coins) {
        if (!coin.taken && rectsOverlap(p, { x: coin.x - coin.r, y: coin.y - coin.r, w: coin.r * 2, h: coin.r * 2 })) {
          coin.taken = true;
          runner.coinsTaken += 1;
          runner.score += 100;
        }
      }
      const swordBox = {
        x: p.facing > 0 ? p.x + p.w : p.x - 38,
        y: p.y + 12,
        w: 38,
        h: 24
      };
      for (const enemy of runner.enemies) {
        if (enemy.dead) continue;
        if (enemy.type === 'sword') {
          enemy.x += enemy.vx * dt;
          if (enemy.x < 260 || enemy.x > 900) enemy.vx *= -1;
          enemy.cooldown -= dt;
          if (Math.abs((enemy.x + enemy.w / 2) - (p.x + p.w / 2)) < 62 && Math.abs(enemy.y - p.y) < 36) {
            enemy.attack = 0.22;
            if (enemy.cooldown <= 0) {
              hitPlayer();
              enemy.cooldown = 1.1;
            }
          }
        } else {
          enemy.cooldown -= dt;
          if (enemy.cooldown <= 0) {
            const direction = p.x < enemy.x ? -1 : 1;
            runner.arrows.push({ x: enemy.x + enemy.w / 2, y: enemy.y + 18, w: 26, h: 6, vx: direction * 250 });
            enemy.attack = 0.18;
            enemy.cooldown = 1.6;
          }
        }
        if (p.attack > 0 && rectsOverlap(swordBox, enemy)) damageEnemy(enemy, 1);
        if (runner.allyTime > 0 && Math.abs(enemy.x - (p.x - 42)) < 70 && Math.abs(enemy.y - p.y) < 50) damageEnemy(enemy, 0.015);
        if (rectsOverlap(p, enemy) && enemy.type === 'sword') hitPlayer();
      }
      runner.enemies = runner.enemies.filter((enemy) => !enemy.dead);
      for (const arrow of runner.arrows) {
        arrow.x += arrow.vx * dt;
        if (rectsOverlap(p, arrow)) {
          arrow.dead = true;
          hitPlayer();
        }
      }
      runner.arrows = runner.arrows.filter((arrow) => !arrow.dead && arrow.x > -40 && arrow.x < 1000);
      for (const bomb of runner.bombs) {
        bomb.vy += 900 * dt;
        bomb.x += bomb.vx * dt;
        bomb.y += bomb.vy * dt;
        const ground = groundYAt(bomb.x);
        if (bomb.y + bomb.r > ground) {
          bomb.y = ground - bomb.r;
          bomb.vy *= -0.28;
          bomb.vx *= 0.72;
        }
        bomb.fuse -= dt;
        if (bomb.fuse <= 0) {
          bomb.explode = 0.25;
          for (const enemy of runner.enemies) {
            const dx = enemy.x + enemy.w / 2 - bomb.x;
            const dy = enemy.y + enemy.h / 2 - bomb.y;
            if (Math.hypot(dx, dy) < 118) damageEnemy(enemy, 3);
          }
        }
      }
      runner.bombs = runner.bombs.filter((bomb) => !bomb.explode);
      for (const pickup of runner.pickups) {
        if (rectsOverlap(p, pickup)) {
          pickup.taken = true;
          if (pickup.type === 'bomb') runner.bombsHeld += 1;
          if (pickup.type === 'ally') runner.allyTime = 12;
        }
      }
      runner.pickups = runner.pickups.filter((pickup) => !pickup.taken);
      if (runner.allyTime > 0) runner.allyTime -= dt;
      runner.spawnTimer += dt;
      if (runner.spawnTimer > 4 && runner.coins.every((coin) => coin.taken)) {
        runner.spawnTimer = 0;
        runner.coins.forEach((coin) => {
          coin.taken = false;
          coin.x = 170 + Math.random() * 680;
          coin.y = 220 + Math.random() * 170;
        });
      }
      runner.pickupTimer += dt;
      if (runner.pickupTimer > 5 && runner.pickups.length < 3) {
        runner.pickupTimer = 0;
        spawnPickup();
      }
      if (runner.enemies.length < 2 && runner.spawnTimer > 2.2) {
        runner.enemies.push({ type: Math.random() < 0.55 ? 'sword' : 'archer', x: 850, y: 402, w: 38, h: 54, vx: -70 - Math.random() * 50, hp: 2, cooldown: 1.2, attack: 0 });
      }
      runner.score += dt * 8;
      if (runner.life <= 0) {
        runner.running = false;
        runnerState.textContent = '終了';
      }
      updateRunnerHud();
      drawRunner();
      requestAnimationFrame(stepRunner);
    }

    function drawRunner() {
      const ctx = runnerCtx;
      ctx.clearRect(0, 0, runnerCanvas.width, runnerCanvas.height);
      const sky = ctx.createLinearGradient(0, 0, 0, 540);
      sky.addColorStop(0, '#101826');
      sky.addColorStop(0.48, '#48211d');
      sky.addColorStop(1, '#b8863c');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 960, 540);
      ctx.fillStyle = 'rgba(255, 232, 168, 0.9)';
      ctx.beginPath();
      ctx.arc(782, 86, 54, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(12, 16, 24, 0.7)';
      ctx.beginPath();
      ctx.moveTo(0, 315);
      ctx.lineTo(130, 205);
      ctx.lineTo(260, 316);
      ctx.lineTo(405, 190);
      ctx.lineTo(570, 318);
      ctx.lineTo(760, 198);
      ctx.lineTo(960, 324);
      ctx.lineTo(960, 540);
      ctx.lineTo(0, 540);
      ctx.fill();
      ctx.fillStyle = '#5e1a16';
      ctx.fillRect(92, 250, 28, 206);
      ctx.fillRect(190, 250, 28, 206);
      ctx.fillRect(70, 222, 170, 30);
      ctx.fillRect(92, 196, 126, 24);
      ctx.fillStyle = 'rgba(255, 240, 196, 0.12)';
      for (let i = 0; i < 7; i += 1) ctx.fillRect(40 + i * 150, 120 + (i % 2) * 34, 72, 10);
      ctx.fillStyle = '#2a1b13';
      for (const platform of runner.platforms) {
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
        ctx.fillStyle = '#c39a45';
        ctx.fillRect(platform.x, platform.y, platform.w, 8);
        ctx.fillStyle = '#2a1b13';
      }
      for (const coin of runner.coins) {
        if (coin.taken) continue;
        ctx.fillStyle = '#f2cd60';
        ctx.beginPath();
        ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#5e4218';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      for (const pickup of runner.pickups) {
        ctx.fillStyle = pickup.type === 'bomb' ? '#232020' : '#2f6b3f';
        ctx.beginPath();
        ctx.arc(pickup.x + 14, pickup.y + 14, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff0bf';
        ctx.font = '900 17px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pickup.type === 'bomb' ? '爆' : '友', pickup.x + 14, pickup.y + 20);
        ctx.textAlign = 'start';
      }
      for (const bomb of runner.bombs) {
        ctx.fillStyle = '#171312';
        ctx.beginPath();
        ctx.arc(bomb.x, bomb.y, bomb.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f0d08b';
        ctx.stroke();
      }
      for (const arrow of runner.arrows) {
        ctx.fillStyle = '#e6d2a6';
        ctx.fillRect(arrow.x, arrow.y, arrow.w, arrow.h);
        ctx.fillStyle = '#8f241d';
        ctx.fillRect(arrow.vx > 0 ? arrow.x + arrow.w : arrow.x - 6, arrow.y - 3, 8, 12);
      }
      for (const enemy of runner.enemies) {
        const facing = enemy.type === 'archer' ? (runner.player.x < enemy.x ? -1 : 1) : (enemy.vx < 0 ? -1 : 1);
        drawSamurai(ctx, enemy.x, enemy.y - 12, facing, {
          armor: enemy.type === 'archer' ? '#26485b' : '#84241f',
          helmet: '#171312',
          trim: enemy.type === 'archer' ? '#c39a45' : '#f0d08b'
        }, enemy.type === 'archer' ? 'bow' : 'sword');
      }
      if (runner.allyTime > 0) {
        drawSamurai(ctx, runner.player.x - 58, runner.player.y, 1, {
          armor: '#2f6b3f',
          helmet: '#171312',
          trim: '#d4b35d'
        }, 'sword');
      }
      const p = runner.player;
      ctx.save();
      ctx.globalAlpha = p.invincible > 0 && Math.floor(p.invincible * 12) % 2 === 0 ? 0.45 : 1;
      drawSamurai(ctx, p.x, p.y, p.facing, {
        armor: '#243244',
        helmet: '#171312',
        trim: '#9b332c'
      }, 'sword');
      if (p.attack > 0) {
        ctx.fillStyle = '#f5e6b5';
        const sx = p.facing > 0 ? p.x + p.w : p.x - 44;
        ctx.fillRect(sx, p.y + 20, 46, 7);
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(255, 247, 224, 0.92)';
      ctx.font = '700 22px sans-serif';
      ctx.fillText('← → 移動 / ↑ Space ジャンプ / Z 剣 / X 爆弾', 24, 36);
      if (!runner.running) {
        ctx.fillStyle = 'rgba(20, 12, 6, 0.55)';
        ctx.fillRect(0, 0, 960, 540);
        ctx.fillStyle = '#fff0bf';
        ctx.font = '900 44px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(runner.life <= 0 ? 'ゲーム終了' : '小判ランナー', 480, 250);
        ctx.font = '700 24px sans-serif';
        ctx.fillText('剣と爆弾で敵を倒しながら進む', 480, 294);
        ctx.textAlign = 'start';
      }
    }

    function startRunner() {
      if (runner.life <= 0) resetRunner();
      runner.running = true;
      runner.lastTime = performance.now();
      runnerState.textContent = 'プレイ中';
      requestAnimationFrame(stepRunner);
    }

    window.addEventListener('keydown', (event) => {
      const keyMap = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ' ': ' ' };
      const key = keyMap[event.key] || event.key.toLowerCase();
      if (['left', 'right', 'up', ' ', 'a', 'd', 'w', 'z', 'j', 'x', 'k'].includes(key)) {
        keys.add(key);
        if (key === 'x' || key === 'k') useBomb();
        if (event.key === ' ' || event.key.startsWith('Arrow')) event.preventDefault();
      }
    });
    window.addEventListener('keyup', (event) => {
      const keyMap = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ' ': ' ' };
      keys.delete(keyMap[event.key] || event.key.toLowerCase());
    });
    runnerStart.addEventListener('click', startRunner);
    runnerReset.addEventListener('click', resetRunner);
    resetRunner();
  </script>
</body>
</html>
