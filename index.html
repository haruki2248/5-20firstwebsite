<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本全土 | 都道府県クイズ</title>
  <style>
    :root {
      --ink: #1a1410;
      --muted: #6f6252;
      --paper: #d8c49b;
      --surface: rgba(245, 230, 197, 0.9);
      --line: #8e7042;
      --blue: #1f4052;
      --blue-dark: #0f2530;
      --red: #7b241f;
      --gold: #c39a45;
      --green: #7fb069;
      --green-dark: #3f7444;
      --shadow: 0 28px 68px rgba(20, 12, 6, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", Arial, sans-serif;
      line-height: 1.6;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% -10%, rgba(195, 154, 69, 0.34), transparent 34rem),
        radial-gradient(circle at 0 8%, rgba(123, 36, 31, 0.26), transparent 24rem),
        radial-gradient(circle at 100% 16%, rgba(15, 37, 48, 0.32), transparent 28rem),
        repeating-linear-gradient(45deg, rgba(26, 20, 16, 0.08) 0 1px, transparent 1px 22px),
        repeating-linear-gradient(135deg, rgba(255, 247, 224, 0.13) 0 1px, transparent 1px 22px),
        linear-gradient(180deg, #2a1b13 0, #8a6d3f 36%, #d8c49b 82%),
        var(--paper);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      content: "";
      background:
        linear-gradient(30deg, transparent 36%, rgba(195, 154, 69, 0.18) 37% 39%, transparent 40%),
        linear-gradient(150deg, transparent 36%, rgba(195, 154, 69, 0.14) 37% 39%, transparent 40%),
        linear-gradient(90deg, rgba(26, 20, 16, 0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(26, 20, 16, 0.08) 1px, transparent 1px),
        radial-gradient(ellipse at center, transparent 40%, rgba(18, 12, 8, 0.46) 100%);
      background-size: 42px 72px, 42px 72px, 84px 84px, 84px 84px, 100% 100%;
      opacity: 0.74;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 56px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 0 40px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      color: #f4dfaa;
      letter-spacing: 0;
      text-shadow: 0 2px 12px rgba(20, 12, 6, 0.42);
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid var(--red);
      border-radius: 8px;
      background: linear-gradient(145deg, #ead39a, #8d2b24);
      color: #fff4d2;
      box-shadow: 4px 4px 0 rgba(20, 12, 6, 0.9);
    }

    .nav-links {
      display: flex;
      gap: 18px;
      font-size: 0.94rem;
    }

    .nav-links a {
      color: #f1dca6;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 2px 10px rgba(20, 12, 6, 0.4);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 0.88fr) minmax(360px, 1.12fr);
      gap: 40px;
      align-items: center;
      min-height: calc(100vh - 220px);
      padding-bottom: 36px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2.8rem, 8vw, 6.4rem);
      line-height: 0.95;
      letter-spacing: 0;
      color: #fff0bf;
      text-shadow:
        0 2px 0 rgba(26, 20, 16, 0.86),
        0 18px 32px rgba(20, 12, 6, 0.42);
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(1.35rem, 2vw, 1.8rem);
      line-height: 1.25;
      color: var(--ink);
    }

    p {
      margin: 0;
      font-size: 1.1rem;
    }

    .lead {
      max-width: 36rem;
      color: #f6e8c7;
      font-size: clamp(1rem, 1.8vw, 1.22rem);
      text-shadow: 0 2px 16px rgba(20, 12, 6, 0.5);
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    .button,
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 240, 196, 0.96), rgba(213, 174, 94, 0.92));
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--ink);
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .button.primary,
    button[aria-pressed="true"] {
      background: linear-gradient(145deg, #9b332c, #5e1a16);
      color: #ffffff;
    }

    .button:hover,
    button:hover,
    .button:focus-visible,
    button:focus-visible {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--ink);
      outline: none;
    }

    .profile {
      display: grid;
      gap: 10px;
      padding: 22px;
      border: 1px solid rgba(195, 154, 69, 0.65);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 244, 215, 0.88), rgba(218, 189, 129, 0.68)),
        var(--surface);
      box-shadow:
        inset 0 0 0 1px rgba(255, 247, 224, 0.58),
        0 20px 46px rgba(20, 12, 6, 0.2);
    }

    .profile p {
      color: var(--muted);
    }

    .google-map-section {
      margin-top: 28px;
      padding: 24px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255, 244, 215, 0.92), rgba(205, 164, 85, 0.7)),
        var(--surface);
      box-shadow:
        inset 0 0 0 1px rgba(255, 247, 224, 0.5),
        var(--shadow);
    }

    .google-map-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .google-map-header p {
      max-width: 34rem;
      color: var(--muted);
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.78fr) minmax(360px, 1.22fr);
      gap: 22px;
      align-items: stretch;
    }

    .game-panel {
      display: grid;
      gap: 16px;
      align-content: start;
      padding: 18px;
      border: 1px solid rgba(26, 20, 16, 0.32);
      border-radius: 8px;
      background: rgba(255, 244, 215, 0.72);
      box-shadow: inset 0 0 0 1px rgba(255, 247, 224, 0.42);
    }

    .api-row {
      display: grid;
      gap: 8px;
    }

    .api-row label,
    .game-stat span {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
    }

    .api-controls {
      display: flex;
      gap: 10px;
    }

    input {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: rgba(255, 248, 232, 0.94);
      color: var(--ink);
      font: inherit;
    }

    .clue-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border: 2px solid rgba(26, 20, 16, 0.82);
      border-radius: 8px;
      background: #d9c18d;
      box-shadow: 6px 6px 0 rgba(26, 20, 16, 0.78);
    }

    .game-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .game-stat {
      padding: 10px;
      border: 1px solid rgba(26, 20, 16, 0.26);
      border-radius: 8px;
      background: rgba(255, 248, 232, 0.7);
    }

    .game-stat strong {
      display: block;
      font-size: 1.45rem;
      line-height: 1.1;
    }

    .result-box {
      min-height: 58px;
      padding: 12px 14px;
      border-left: 6px solid var(--gold);
      border-radius: 8px;
      background: rgba(255, 248, 232, 0.8);
      font-weight: 800;
    }

    .result-box.correct {
      border-left-color: #2f6b3f;
      color: #214d2e;
    }

    .result-box.wrong {
      border-left-color: var(--red);
      color: #6d1f1a;
    }

    .google-map-frame {
      width: 100%;
      height: min(68vh, 520px);
      min-height: 360px;
      border: 2px solid rgba(26, 20, 16, 0.78);
      border-radius: 8px;
      box-shadow:
        inset 0 0 0 1px rgba(255, 247, 224, 0.42),
        0 14px 32px rgba(20, 12, 6, 0.22);
    }

    @media (max-width: 860px) {
      main {
        padding: 28px 16px 40px;
      }

      .site-header {
        align-items: flex-start;
        padding-bottom: 28px;
      }

      .nav-links {
        gap: 12px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero {
        gap: 24px;
        min-height: auto;
      }

      .game-layout {
        grid-template-columns: 1fr;
      }

      .google-map-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 560px) {
      .site-header,
      .hero-actions {
        align-items: stretch;
        flex-direction: column;
      }

      .nav-links {
        flex-wrap: wrap;
      }

      .button,
      button {
        width: 100%;
      }

      .google-map-section {
        padding: 16px;
      }

      .google-map-frame {
        min-height: 320px;
      }

      .api-controls,
      .game-stats {
        grid-template-columns: 1fr;
      }

      .api-controls {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">日</span>
        <span>日本全土</span>
      </div>
      <nav class="nav-links" aria-label="ページ内メニュー">
        <a href="#about">About</a>
        <a href="#map">Map</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">日本を<br>見つける</h1>
        <p class="lead">Google Mapsで日本全体を表示し、拡大・縮小や移動をしながら各地を確認できるシンプルなWebサイトです。</p>
        <div class="hero-actions">
          <a class="button primary" href="#map">ゲームを始める</a>
          <a class="button" href="#about">サイトについて</a>
        </div>
      </div>

      <section id="about" class="profile" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
        <p>GitHub Pagesで公開できる、都道府県クイズです。ヒント画像を見て、Google Map上で答えだと思う都道府県をクリックします。</p>
      </section>
    </section>

    <section id="map" class="google-map-section" aria-labelledby="google-map-title">
      <div class="google-map-header">
        <div>
          <h2 id="google-map-title">都道府県クイズ</h2>
          <p>特産品や観光地のヒント画像を見て、Google Mapで該当する都道府県をクリックしてください。</p>
        </div>
      </div>
      <div class="game-layout">
        <aside class="game-panel" aria-label="クイズ操作パネル">
          <div class="api-row">
            <label for="api-key">Google Maps APIキー</label>
            <div class="api-controls">
              <input id="api-key" type="password" autocomplete="off" placeholder="APIキーを入力">
              <button id="load-map" type="button">地図を起動</button>
            </div>
          </div>
          <img id="clue-image" class="clue-image" alt="都道府県クイズのヒント画像">
          <div class="hero-actions">
            <button id="start-game" class="primary" type="button" disabled>ゲーム開始</button>
            <button id="next-question" type="button" disabled>次の問題</button>
          </div>
          <div class="game-stats">
            <div class="game-stat"><span>問題</span><strong id="round-count">0</strong></div>
            <div class="game-stat"><span>正解</span><strong id="score-count">0</strong></div>
            <div class="game-stat"><span>連続</span><strong id="streak-count">0</strong></div>
          </div>
          <div id="result" class="result-box">APIキーを入力して地図を起動してください。</div>
        </aside>
        <div id="google-map" class="google-map-frame" role="application" aria-label="回答用Google Map"></div>
      </div>
    </section>
  </main>

    let answered = false;

    const clueImage = document.getElementById('clue-image');
    const result = document.getElementById('result');
    const scoreCount = document.getElementById('score-count');
    const roundCount = document.getElementById('round-count');
    const streakCount = document.getElementById('streak-count');
    const startButton = document.getElementById('start-game');
    const nextButton = document.getElementById('next-question');
    const loadMapButton = document.getElementById('load-map');
    const apiKeyInput = document.getElementById('api-key');

    function makeClueImage(prefecture) {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720">
          <defs>
            <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0" stop-color="${prefecture.colorA}"/>
              <stop offset="1" stop-color="${prefecture.colorB}"/>
            </linearGradient>
            <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
              <path d="M0 28H56M28 0V56" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
              <path d="M0 0L56 56M56 0L0 56" stroke="rgba(0,0,0,.1)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="960" height="720" fill="url(#bg)"/>
          <rect width="960" height="720" fill="url(#grid)" opacity=".75"/>
          <circle cx="720" cy="150" r="190" fill="rgba(255,244,210,.28)"/>
          <circle cx="245" cy="390" r="220" fill="rgba(26,20,16,.18)"/>
          <rect x="68" y="72" width="824" height="576" rx="32" fill="rgba(255,247,224,.18)" stroke="rgba(255,247,224,.68)" stroke-width="8"/>
          <text x="480" y="272" text-anchor="middle" font-family="serif" font-size="180" font-weight="900" fill="rgba(255,247,224,.96)">${prefecture.icon}</text>
          <text x="480" y="430" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="800" fill="rgba(255,247,224,.96)">これはどこの都道府県？</text>
          <text x="480" y="506" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="rgba(26,20,16,.82)">${prefecture.clue}</text>
        </svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    function setResult(message, type) {
      result.textContent = message;
      result.className = 'result-box' + (type ? ` ${type}` : '');
    }

    function updateStats() {
      scoreCount.textContent = score;
      roundCount.textContent = round;
      streakCount.textContent = streak;
    }

    function chooseQuestion() {
      answered = false;
      currentQuestion = prefectures[Math.floor(Math.random() * prefectures.length)];
      clueImage.src = makeClueImage(currentQuestion);
      clueImage.alt = `${currentQuestion.clue}を描いた都道府県クイズのヒント画像`;
      nextButton.disabled = true;
      setResult('ヒント画像を見て、Google Map上で答えをクリックしてください。');
      if (marker) marker.setMap(null);
    }

    function startGame() {
      score = 0;
      round = 1;
      streak = 0;
      updateStats();
      chooseQuestion();
    }

    function nextQuestion() {
      round += 1;
      updateStats();
      chooseQuestion();
    }

    function normalizePrefecture(name) {
      if (!name) return '';
      const cleaned = name.replace(/\s+Prefecture$/i, '').replace(/\s+Metropolis$/i, '').trim();
      if (englishPrefectureMap[cleaned]) return englishPrefectureMap[cleaned];
      return cleaned;
    }

    function extractPrefecture(results) {
      for (const item of results) {
        for (const component of item.address_components) {
          if (component.types.includes('administrative_area_level_1')) {
            return normalizePrefecture(component.long_name);
          }
        }
      }
      return '';
    }

    function answerAt(latLng) {
      if (!currentQuestion || answered) return;
      geocoder.geocode({ location: latLng }, (results, status) => {
        if (status !== 'OK' || !results.length) {
          setResult('この場所の都道府県を判定できませんでした。日本国内をクリックしてください。', 'wrong');
          return;
        }
        const selected = extractPrefecture(results);
        if (!selected) {
          setResult('都道府県を読み取れませんでした。別の場所をクリックしてください。', 'wrong');
          return;
        }
        answered = true;
        marker = new google.maps.Marker({ position: latLng, map });
        if (selected === currentQuestion.name) {
          score += 1;
          streak += 1;
          setResult(`正解です。答えは${currentQuestion.name}でした。`, 'correct');
        } else {
          streak = 0;
          setResult(`不正解です。クリックした場所は${selected}、正解は${currentQuestion.name}でした。`, 'wrong');
        }
        updateStats();
        nextButton.disabled = false;
      });
    }

    window.initQuizMap = function () {
      geocoder = new google.maps.Geocoder();
      map = new google.maps.Map(document.getElementById('google-map'), {
        center: { lat: 37.8, lng: 138.2 },
        zoom: 5,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: true
      });
      map.addListener('click', (event) => answerAt(event.latLng));
      startButton.disabled = false;
      setResult('地図を起動しました。ゲーム開始ボタンを押してください。');
    };

    function loadGoogleMap() {
      const key = apiKeyInput.value.trim();
      if (!key) {
        setResult('Google Maps JavaScript APIキーを入力してください。', 'wrong');
        return;
      }
      loadMapButton.disabled = true;
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=initQuizMap&language=ja&region=JP`;
      script.async = true;
      script.defer = true;
      script.onerror = () => {
        loadMapButton.disabled = false;
        setResult('Google Mapsを読み込めませんでした。APIキーや制限設定を確認してください。', 'wrong');
      };
      document.head.appendChild(script);
    }

    clueImage.src = makeClueImage(prefectures[0]);
    clueImage.alt = '都道府県クイズのヒント画像';
    loadMapButton.addEventListener('click', loadGoogleMap);
    startButton.addEventListener('click', startGame);
    nextButton.addEventListener('click', nextQuestion);
  </script>
</body>
</html>
