<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本全土</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f7f7f7;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin-bottom: 16px;
      font-size: 2.5rem;
    }

    p {
      font-size: 1.1rem;
    }

    .profile,
    .map-section {
      margin-top: 32px;
      padding: 24px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .map-section {
      text-align: center;
    }

    .map-note {
      margin-bottom: 16px;
      color: #555;
    }

    .map-container {
      display: inline-block;
      max-width: 100%;
      width: 360px;
    }

    svg {
      width: 100%;
      height: auto;
      cursor: pointer;
    }

    .region,
    .prefecture {
      fill: #a4d4ff;
      stroke: #2b6cb0;
      stroke-width: 2;
      transition: fill 0.2s ease, transform 0.2s ease;
    }

    .region:hover,
    .region:focus,
    .prefecture:hover,
    .prefecture:focus {
      fill: #70b7ff;
      transform: scale(1.02);
    }

    .hidden {
      display: none;
    }

    .map-info {
      margin-top: 18px;
      padding: 12px 16px;
      background: #eef6ff;
      border: 1px solid #b3d7ff;
      border-radius: 6px;
      font-weight: bold;
      color: #1a5a9b;
    }
  </style>
</head>
<body>
  <main>
    <h1>こんにちは</h1>
    <p>ここは私のWebサイトです。</p>

    <section class="profile">
      <h2>About</h2>
      <p>このページはGitHub Pagesで公開するためのシンプルなHTMLです。</p>
    </section>

    <section class="map-section">
      <h2>日本地図</h2>
      <p class="map-note">地図の切り替えボタンで「地域マップ」と「都道府県マップ」を切り替えられます。</p>
      <div class="map-controls">
        <button id="toggle-map" type="button">都道府県マップに切り替える</button>
      </div>
      <div class="map-container" role="img" aria-label="日本地図">
        <svg id="region-map" class="map-svg" viewBox="0 0 300 760" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path class="region" data-name="北海道" d="M130 20 L190 20 L205 60 L180 90 L130 90 Z" tabindex="0" />
          <path class="region" data-name="東北" d="M130 110 L190 110 L195 170 L160 190 L120 170 Z" tabindex="0" />
          <path class="region" data-name="関東" d="M145 210 L190 210 L205 250 L180 270 L140 250 Z" tabindex="0" />
          <path class="region" data-name="中部" d="M105 280 L170 280 L190 340 L150 360 L110 340 Z" tabindex="0" />
          <path class="region" data-name="関西" d="M85 380 L155 380 L170 430 L130 450 L90 430 Z" tabindex="0" />
          <path class="region" data-name="中国" d="M55 470 L120 470 L140 520 L100 540 L60 520 Z" tabindex="0" />
          <path class="region" data-name="四国" d="M170 500 L220 500 L240 540 L210 565 L170 540 Z" tabindex="0" />
          <path class="region" data-name="九州" d="M60 580 L130 580 L150 640 L110 660 L70 640 Z" tabindex="0" />
          <path class="region" data-name="沖縄" d="M160 690 L210 690 L210 720 L160 720 Z" tabindex="0" />
        </svg>

        <svg id="prefecture-map" class="map-svg hidden" viewBox="0 0 300 760" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path class="prefecture" data-name="北海道" d="M130 20 L190 20 L205 60 L180 90 L130 90 Z" tabindex="0" />
          <path class="prefecture" data-name="青森" d="M135 105 L170 105 L175 125 L165 135 L145 130 Z" tabindex="0" />
          <path class="prefecture" data-name="宮城" d="M140 140 L175 140 L185 170 L155 180 L135 160 Z" tabindex="0" />
          <path class="prefecture" data-name="東京" d="M155 220 L185 220 L195 245 L170 255 L150 235 Z" tabindex="0" />
          <path class="prefecture" data-name="愛知" d="M125 310 L165 310 L175 335 L145 345 L125 325 Z" tabindex="0" />
          <path class="prefecture" data-name="大阪" d="M100 390 L145 390 L155 420 L130 430 L110 410 Z" tabindex="0" />
          <path class="prefecture" data-name="広島" d="M75 475 L120 475 L130 500 L100 505 L80 490 Z" tabindex="0" />
          <path class="prefecture" data-name="香川" d="M200 505 L230 505 L240 525 L215 535 L195 520 Z" tabindex="0" />
          <path class="prefecture" data-name="福岡" d="M70 585 L120 585 L130 615 L100 630 L75 610 Z" tabindex="0" />
          <path class="prefecture" data-name="鹿児島" d="M75 655 L110 655 L120 675 L95 685 L75 670 Z" tabindex="0" />
          <path class="prefecture" data-name="沖縄" d="M160 690 L210 690 L210 720 L160 720 Z" tabindex="0" />
        </svg>
      </div>
      <div id="map-info" class="map-info">地名をクリックしてください。</div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const info = document.getElementById('map-info');
      const toggleButton = document.getElementById('toggle-map');
      const regionMap = document.getElementById('region-map');
      const prefectureMap = document.getElementById('prefecture-map');
      let currentLevel = 'region';

      function setMapLevel(level) {
        currentLevel = level;
        const isRegion = level === 'region';
        regionMap.classList.toggle('hidden', !isRegion);
        prefectureMap.classList.toggle('hidden', isRegion);
        toggleButton.textContent = isRegion ? '都道府県マップに切り替える' : '地域マップに戻す';
        info.textContent = (isRegion ? '地域マップ' : '都道府県マップ') + 'を表示しています。地図をクリックしてください。';
      }

      function addMapListeners(selector) {
        const elements = document.querySelectorAll(selector);
        elements.forEach(function (element) {
          element.addEventListener('click', function () {
            info.textContent = element.dataset.name + ' が選択されました。';
          });
          element.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              element.click();
            }
          });
        });
      }

      toggleButton.addEventListener('click', function () {
        setMapLevel(currentLevel === 'region' ? 'prefecture' : 'region');
      });

      addMapListeners('.region');
      addMapListeners('.prefecture');
    });
  </script>
</body>
</html>
